<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Gerai-Virzen - Pesanan Masuk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

  <!-- Header Admin -->
  <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
    <div>
      <h1 class="text-xl font-bold text-amber-500">Dashboard Kasir</h1>
      <p class="text-xs text-slate-400">Gerai-Virzen (Real-Time Mode)</p>
    </div>
    <span class="bg-green-500/20 text-green-400 text-xs px-3 py-1 rounded-full border border-green-500/30">● Live</span>
  </div>

  <!-- Container Pesanan -->
  <div id="daftar-pesanan" class="space-y-4">
    <p id="pesan-kosong" class="text-slate-500 text-center py-10">Belum ada pesanan masuk...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://cplkexlzurgzbspkkbap.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_30Zmc6NDgoS_arYtPAEQCQ_KVz2fXDm'
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    // Fungsi Render Card Pesanan
    function tampilkanPesanan(order) {
      document.getElementById('pesan-kosong')?.remove()
      
      const container = document.getElementById('daftar-pesanan')
      const card = document.createElement('div')
      card.className = "bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-lg transition animate-bounce"
      
      let itemHtml = ''
      order.items.forEach(i => {
        itemHtml += `<li class="text-sm text-slate-300">${i.nama} x 1 - <span class="text-amber-400">Rp ${i.harga.toLocaleString('id-ID')}</span></li>`
      })

      card.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <span class="bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded-lg text-sm">Meja ${order.table_number}</span>
          <span class="text-xs text-slate-400">${new Date(order.created_at).toLocaleTimeString('id-ID')}</span>
        </div>
        <ul class="my-3 space-y-1 border-y border-slate-700/50 py-2">
          ${itemHtml}
        </ul>
        <div class="flex justify-between items-center mt-3">
          <div>
            <p class="text-xs text-slate-400">Total Bayar</p>
            <p class="font-bold text-green-400">Rp ${order.total_price.toLocaleString('id-ID')}</p>
          </div>
          <button onclick="this.parentElement.parentElement.remove()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg">Selesai</button>
        </div>
      `
      container.prepend(card)
    }

    // Dengarkan Pesanan Baru via Realtime Supabase
    supabaseClient
      .channel('public:orders')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
        tampilkanPesanan(payload.new)
      })
      .subscribe()
  </script>
</body>
</html>
