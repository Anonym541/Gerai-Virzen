<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerai-Virzen - Pesan Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 pb-24">

  <!-- Header -->
  <div class="bg-amber-600 text-white p-4 sticky top-0 shadow-md">
    <h1 class="text-xl font-bold">Gerai-Virzen</h1>
    <p id="info-meja" class="text-sm opacity-90">Meja: Memuat...</p>
  </div>

  <!-- Daftar Menu -->
  <div class="p-4 space-y-4">
    <h2 class="font-bold text-gray-700">Daftar Menu</h2>
    
    <!-- Item 1 -->
    <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
      <div>
        <h3 class="font-bold text-gray-800">Es Teh Manis</h3>
        <p class="text-amber-600 font-semibold">Rp 5.000</p>
      </div>
      <button onclick="tambahItem('Es Teh Manis', 5000)" class="bg-amber-600 text-white px-3 py-1.5 rounded-lg text-sm active:scale-95 transition">+ Tambah</button>
    </div>

    <!-- Item 2 -->
    <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
      <div>
        <h3 class="font-bold text-gray-800">Kopi Hitam</h3>
        <p class="text-amber-600 font-semibold">Rp 6.000</p>
      </div>
      <button onclick="tambahItem('Kopi Hitam', 6000)" class="bg-amber-600 text-white px-3 py-1.5 rounded-lg text-sm active:scale-95 transition">+ Tambah</button>
    </div>
  </div>

  <!-- Bar Keranjang Bottom -->
  <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t shadow-lg flex justify-between items-center">
    <div>
      <p class="text-xs text-gray-500">Total Pesanan</p>
      <p id="total-harga" class="text-lg font-bold text-amber-600">Rp 0</p>
    </div>
    <button onclick="kirimPesanan()" class="bg-green-600 text-white font-bold px-5 py-2.5 rounded-xl active:scale-95 transition">Pesan Sekarang</button>
  </div>

  <script>
    // Konfigurasi Supabase Milikmu
    const SUPABASE_URL = 'https://cplkexlzurgzbspkkbap.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_30Zmc6NDgoS_arYtPAEQCQ_KVz2fXDm'
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    // Deteksi Nomor Meja dari URL (?meja=1)
    const urlParams = new URLSearchParams(window.location.search)
    const noMeja = urlParams.get('meja') || '1'
    document.getElementById('info-meja').innerText = 'Nomor Meja: ' + noMeja

    let keranjang = []
    let total = 0

    function tambahItem(nama, harga) {
      keranjang.push({ nama, harga })
      total += harga
      document.getElementById('total-harga').innerText = 'Rp ' + total.toLocaleString('id-ID')
      alert(nama + ' ditambahkan ke keranjang!')
    }

    async function kirimPesanan() {
      if (keranjang.length === 0) return alert('Keranjang masih kosong!')

      const { data, error } = await supabaseClient.from('orders').insert([
        {
          table_number: noMeja,
          items: keranjang,
          total_price: total,
          payment_method: 'CASH',
          status: 'PENDING'
        }
      ])

      if (error) {
        alert('Gagal mengirim pesanan: ' + error.message)
      } else {
        alert('Pesanan berhasil dikirim ke kasir!')
        keranjang = []
        total = 0
        document.getElementById('total-harga').innerText = 'Rp 0'
      }
    }
  </script>
</body>
</html>
